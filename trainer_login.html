<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trainer-Login – USV Jugendfußball</title>
<style>
:root{--green:#0d7a3d;--text:#17221d;--muted:#718078}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:radial-gradient(circle at 80% 10%,rgba(20,140,75,.18),transparent 35%),linear-gradient(145deg,#062d1b,#0b5a30 55%,#062d1b);display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:460px}
.brand{text-align:center;color:#fff;margin-bottom:22px}
.logo{width:82px;height:82px;margin:auto auto 16px;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:90%;height:90%;object-fit:contain}
.brand h1{margin:0;font-size:28px}
.brand p{margin:8px 0 0;color:#ffffffc7}
.card{background:#fff;border-radius:28px;padding:34px;box-shadow:0 25px 70px #0004}
.eyebrow{margin:0 0 8px;color:var(--green);font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.card h2{margin:0 0 8px;font-size:30px}
.intro{margin:0 0 26px;color:var(--muted);line-height:1.5}
.field{margin-bottom:18px}
label{display:block;margin-bottom:8px;font-weight:700;font-size:14px}
input{width:100%;padding:15px 16px;border:1px solid #dfe7e2;border-radius:13px;font-size:16px;outline:none;background:#fbfcfb}
input:focus{border-color:var(--green);box-shadow:0 0 0 3px #0d7a3d1a}
button{width:100%;border:0;border-radius:14px;padding:16px;background:var(--green);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
button:disabled{opacity:.65;cursor:wait}
.msg{display:none;margin-top:18px;padding:13px 15px;border-radius:12px;font-size:14px;line-height:1.45}
.error{display:block;color:#b42318;background:#fff1f0;border:1px solid #ffd5d2}
.success{display:block;color:#086c37;background:#eaf6ef;border:1px solid #ccebd8}
.back{display:block;text-align:center;margin-top:20px;color:#ffffffd1;text-decoration:none;font-size:14px}
.small{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center}
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">
    <!-- Logo.png liegt im GitHub-Repository im gleichen Ordner wie diese Datei. -->
    <div class="logo"><img src="Logo.png" alt="USV Jugendfußball"></div>
    <h1>USV Jugendfußball</h1>
    <p>Geschützter Trainerbereich</p>
  </div>

  <section class="card">
    <p class="eyebrow">Trainerbereich</p>
    <h2>Trainer-Login</h2>
    <p class="intro">Bitte mit deiner hinterlegten E-Mail-Adresse und deinem Passwort anmelden.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">E-Mail-Adresse</label>
        <input id="email" type="email" autocomplete="username" placeholder="name@beispiel.de" required>
      </div>
      <div class="field">
        <label for="password">Passwort</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Passwort" required>
      </div>
      <button id="loginButton" type="submit">Zum Trainerbereich</button>
      <div id="message" class="msg"></div>
    </form>

    <p class="small">Der Zugang ist ausschließlich für freigeschaltete Trainer vorgesehen.</p>
  </section>

  <a class="back" href="index.html">← Zurück zur Startseite</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   SUPABASE KONFIGURATION
   HIER NUR DIESE BEIDEN WERTE EINTRAGEN.
   ============================================================ */
const SUPABASE_URL = "DEINE_SUPABASE_PROJECT_URL";
const SUPABASE_PUBLISHABLE_KEY = "DEIN_SB_PUBLISHABLE_KEY";

/* ============================================================
   WICHTIG:
   Die CDN-Bibliothek stellt bereits window.supabase bereit.
   Deshalb darf hier KEINE Variable "supabase" neu deklariert
   werden. Wir verwenden bewusst "supabaseClient".
   ============================================================ */
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

/* Später liegt die geschützte Seite hier. */
const TRAINER_BEREICH = "bereich.html";

function message(text,type){
  const el=document.getElementById("message");
  el.textContent=text;
  el.className="msg "+type;
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const button=document.getElementById("loginButton");

  button.disabled=true;
  button.textContent="Anmeldung läuft …";
  document.getElementById("message").className="msg";

  try{
    const {data:authData,error:authError} =
      await supabaseClient.auth.signInWithPassword({email,password});

    if(authError) throw authError;

    const {data:profile,error:profileError} =
      await supabaseClient
        .from("trainer_profiles")
        .select("role")
        .eq("id",authData.user.id)
        .single();

    if(profileError||!profile){
      await supabaseClient.auth.signOut();
      throw new Error("Dein Zugang ist noch nicht für den Trainerbereich freigeschaltet.");
    }

    if(profile.role!=="trainer"&&profile.role!=="admin"){
      await supabaseClient.auth.signOut();
      throw new Error("Für diesen Zugang wurde keine gültige Trainerrolle gefunden.");
    }

    message("Anmeldung erfolgreich. Trainerbereich wird geöffnet …","success");
    button.textContent="Angemeldet ✓";

    setTimeout(()=>{
      window.location.href=TRAINER_BEREICH;
    },700);

  }catch(error){
    console.error("Trainer-Login:",error);
    message(error.message||"Die Anmeldung konnte nicht durchgeführt werden.","error");
    button.disabled=false;
    button.textContent="Zum Trainerbereich";
  }
});
</script>
</body>
</html>
