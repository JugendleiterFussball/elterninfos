<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Neues Passwort | USV TU Dresden</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(
          rgba(8, 35, 20, 0.88),
          rgba(8, 35, 20, 0.88)
        ),
        linear-gradient(135deg, #0d3b22, #1d6b3a);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      color: #173222;
      border-radius: 22px;
      padding: 32px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    .logo {
      display: block;
      width: 92px;
      max-width: 35%;
      margin: 0 auto 22px;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      font-size: 28px;
    }

    .intro {
      margin: 0 0 26px;
      text-align: center;
      color: #5b6f62;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #ccd8cf;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #1e7a42;
      box-shadow: 0 0 0 3px rgba(30, 122, 66, 0.12);
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #1e7a42;
      color: #ffffff;
    }

    button:hover {
      background: #176636;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      line-height: 1.45;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #eaf7ee;
      color: #176636;
    }

    .message.error {
      display: block;
      background: #fdeceb;
      color: #a12821;
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #1e7a42;
      text-decoration: none;
      font-weight: 700;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 26px 20px;
        border-radius: 18px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <img
      src="../assets/Logo.png"
      alt="USV TU Dresden"
      class="logo"
    >

    <h1>Neues Passwort</h1>

    <p class="intro">
      Bitte vergib ein neues Passwort für deinen Trainerzugang.
    </p>

    <form id="passwordForm">

      <label for="password">
        Neues Passwort
      </label>

      <input
        type="password"
        id="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <label for="passwordRepeat">
        Passwort wiederholen
      </label>

      <input
        type="password"
        id="passwordRepeat"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button
        type="submit"
        id="submitButton"
      >
        Passwort speichern
      </button>

    </form>

    <div
      id="message"
      class="message"
    ></div>

    <a
      href="login.html"
      class="back"
    >
      Zurück zum Trainer-Login
    </a>

  </main>

  <script>
    const SUPABASE_URL =
      "https://sluoffqujtofnhmfqfac.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_MbxdNe22XUoLVfF5_K-6xA_Wkos9EmS";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const form =
      document.getElementById(
        "passwordForm"
      );

    const password =
      document.getElementById(
        "password"
      );

    const passwordRepeat =
      document.getElementById(
        "passwordRepeat"
      );

    const submitButton =
      document.getElementById(
        "submitButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    function showMessage(
      text,
      type
    ) {
      message.textContent = text;
      message.className =
        "message " + type;
    }

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        message.className =
          "message";

        if (
          password.value !==
          passwordRepeat.value
        ) {
          showMessage(
            "Die beiden Passwörter stimmen nicht überein.",
            "error"
          );

          return;
        }

        if (
          password.value.length < 8
        ) {
          showMessage(
            "Das Passwort muss mindestens 8 Zeichen lang sein.",
            "error"
          );

          return;
        }

        submitButton.disabled = true;

        submitButton.textContent =
          "Wird gespeichert ...";

        const {
          data,
          error
        } =
          await supabaseClient.auth.updateUser({
            password:
              password.value
          });

        if (error) {

          showMessage(
            "Das Passwort konnte nicht geändert werden. Bitte öffne den Link aus der Passwort-E-Mail erneut.",
            "error"
          );

          submitButton.disabled =
            false;

          submitButton.textContent =
            "Passwort speichern";

          return;
        }

        showMessage(
          "Dein Passwort wurde erfolgreich geändert. Du wirst gleich zum Login weitergeleitet.",
          "success"
        );

        await supabaseClient.auth.signOut();

        setTimeout(
          function() {
            window.location.href =
              "login.html";
          },
          2500
        );
      }
    );
  </script>

</body>
</html>
