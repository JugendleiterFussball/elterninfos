<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trainer-Login – USV Jugendfußball</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          145deg,
          #062d1b,
          #0b5a30,
          #062d1b
        );

      color: #17221d;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 460px;
    }

    .brand {
      text-align: center;
      color: white;
      margin-bottom: 22px;
    }

    .logo {
      display: block;
      width: 95px;
      height: 95px;
      margin: 0 auto 15px;
      object-fit: contain;
    }

    .brand h1 {
      margin: 0;
      font-size: 28px;
    }

    .brand p {
      margin: 8px 0 0;
      color: rgba(255,255,255,.8);
    }

    .login-card {
      background: white;
      border-radius: 28px;
      padding: 34px;

      box-shadow:
        0 25px 70px rgba(0,0,0,.25);
    }

    .eyebrow {
      margin: 0 0 8px;

      color: #0d7a3d;

      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .login-card h2 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .intro {
      margin: 0 0 26px;
      color: #718078;
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;

      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;

      padding: 15px 16px;

      border: 1px solid #dfe7e2;
      border-radius: 13px;

      font-size: 16px;
      outline: none;

      background: #fbfcfb;
    }

    input:focus {
      border-color: #0d7a3d;

      box-shadow:
        0 0 0 3px rgba(13,122,61,.1);
    }

    button {
      width: 100%;

      border: 0;
      border-radius: 14px;

      padding: 16px;

      background: #0d7a3d;
      color: white;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }

    button:hover {
      background: #096632;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .message {
      display: none;

      margin-top: 18px;
      padding: 13px 15px;

      border-radius: 12px;

      font-size: 14px;
      line-height: 1.45;
    }

    .message.error {
      display: block;

      color: #b42318;
      background: #fff1f0;

      border: 1px solid #ffd5d2;
    }

    .message.success {
      display: block;

      color: #086c37;
      background: #eaf6ef;

      border: 1px solid #ccebd8;
    }

    .back {
      display: block;

      text-align: center;

      margin-top: 20px;

      color: rgba(255,255,255,.85);

      text-decoration: none;

      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 26px 22px;
        border-radius: 22px;
      }

      .brand h1 {
        font-size: 24px;
      }

      .logo {
        width: 78px;
        height: 78px;
      }
    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <div class="brand">

      <img
        src="../assets/Logo.png"
        alt="USV Jugendfußball"
        class="logo"
      >

      <h1>USV Jugendfußball</h1>

      <p>Geschützter Trainerbereich</p>

    </div>


    <section class="login-card">

      <p class="eyebrow">
        Trainerbereich
      </p>

      <h2>
        Trainer-Login
      </h2>

      <p class="intro">
        Bitte mit deiner hinterlegten E-Mail-Adresse
        und deinem Passwort anmelden.
      </p>


      <form id="loginForm">

        <div class="field">

          <label for="email">
            E-Mail-Adresse
          </label>

          <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="name@beispiel.de"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Passwort
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Passwort"
            required
          >

        </div>


        <button
          id="loginButton"
          type="submit"
        >
          Zum Trainerbereich
        </button>


        <div
          id="message"
          class="message"
        ></div>

      </form>

    </section>


    <a
      class="back"
      href="../index.html"
    >
      ← Zurück zur Startseite
    </a>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://sluoffqujtofnhmfqfac.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_MbxdNe22XUoLVfF5_K-6xA_Wkos9EmS";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        "message " + type;
    }


    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          const button =
            document.getElementById("loginButton");


          button.disabled = true;

          button.textContent =
            "Anmeldung läuft …";


          document
            .getElementById("message")
            .className =
              "message";


          try {

            console.log(
              "Trainer-Login gestartet"
            );


            const {
              data,
              error
            } =
              await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
              });


            console.log(
              "Supabase Antwort:",
              data,
              error
            );


            if (error) {
              throw error;
            }


            if (!data || !data.user) {

              throw new Error(
                "Supabase hat keinen Benutzer zurückgegeben."
              );

            }


            showMessage(
              "Anmeldung erfolgreich. Trainerbereich wird geöffnet …",
              "success"
            );


            button.textContent =
              "Angemeldet ✓";


            setTimeout(function() {

              window.location.href =
                "index.html";

            }, 700);


          } catch (error) {

            console.error(
              "Trainer-Login:",
              error
            );


            showMessage(
              error.message ||
              "Die Anmeldung konnte nicht durchgeführt werden.",
              "error"
            );


            button.disabled = false;

            button.textContent =
              "Zum Trainerbereich";
          }

        }
      );

  </script>

</body>
</html>
