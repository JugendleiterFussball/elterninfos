<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Trainer-Login – USV Jugendfußball</title>

  <style>

    /* =========================================================
       GRUNDLAGEN
       ========================================================= */

    :root{
      --green:#0b6b35;
      --green-2:#159447;
      --green-dark:#062d1b;

      --text:#17221d;
      --muted:#68746d;

      --card:#ffffff;
      --line:#dfe7e2;

      --blue:#1769e0;
      --blue-dark:#0f5dcc;
    }

    *{
      box-sizing:border-box;
    }

    html{
      min-height:100%;
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      min-height:100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        Helvetica,
        sans-serif;

      color:var(--text);

      background:
        radial-gradient(
          circle at 78% 18%,
          rgba(28,151,75,.28),
          transparent 30%
        ),
        radial-gradient(
          circle at 18% 82%,
          rgba(13,93,48,.22),
          transparent 32%
        ),
        linear-gradient(
          135deg,
          #04150b 0%,
          #062d1b 48%,
          #0b5a30 100%
        );

      display:flex;
      align-items:center;
      justify-content:center;

      padding:
        clamp(18px,4vw,48px);

      overflow-x:hidden;
    }


    /* =========================================================
       DEZENTES HINTERGRUNDMUSTER
       ========================================================= */

    body::before{
      content:"";
      position:fixed;
      inset:0;

      background:
        repeating-linear-gradient(
          120deg,
          rgba(255,255,255,.025) 0 1px,
          transparent 1px 70px
        );

      pointer-events:none;
      opacity:.9;
    }


    /* =========================================================
       HAUPTBEREICH
       ========================================================= */

    .login-wrapper{
      position:relative;
      z-index:2;

      width:100%;
      max-width:520px;

      margin:auto;
    }


    /* =========================================================
       LOGO / BRAND
       ========================================================= */

    .brand{
      text-align:center;
      color:white;

      margin-bottom:
        clamp(18px,3vw,26px);
    }

    .logo{
      display:block;

      width:
        clamp(72px,10vw,105px);

      height:
        clamp(72px,10vw,105px);

      margin:
        0 auto clamp(12px,2vw,17px);

      object-fit:contain;

      filter:
        drop-shadow(0 8px 18px rgba(0,0,0,.25));
    }

    .brand h1{
      margin:0;

      font-size:
        clamp(24px,4vw,31px);

      line-height:1.1;
      letter-spacing:-.025em;
    }

    .brand p{
      margin:8px 0 0;

      color:
        rgba(255,255,255,.82);

      font-size:
        clamp(13px,2vw,15px);

      line-height:1.45;
    }


    /* =========================================================
       LOGIN-KARTE
       ========================================================= */

    .login-card{
      width:100%;

      background:var(--card);

      border:
        1px solid rgba(255,255,255,.65);

      border-radius:
        clamp(20px,3vw,28px);

      padding:
        clamp(24px,5vw,38px);

      box-shadow:
        0 28px 80px rgba(0,0,0,.28),
        0 4px 16px rgba(0,0,0,.08);
    }


    /* =========================================================
       KOPFBEREICH
       ========================================================= */

    .eyebrow{
      margin:0 0 8px;

      color:var(--green);

      font-size:
        clamp(11px,1.8vw,13px);

      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .login-card h2{
      margin:0 0 9px;

      font-size:
        clamp(27px,5vw,32px);

      line-height:1.1;
      letter-spacing:-.025em;
    }

    .intro{
      margin:
        0 0 clamp(22px,4vw,28px);

      color:var(--muted);

      font-size:
        clamp(14px,2vw,15px);

      line-height:1.55;
    }


    /* =========================================================
       FORMULAR
       ========================================================= */

    .field{
      margin-bottom:
        clamp(15px,3vw,19px);
    }

    label{
      display:block;

      margin-bottom:8px;

      font-size:
        clamp(13px,2vw,14px);

      font-weight:750;
    }

    input{
      display:block;

      width:100%;
      min-height:52px;

      padding:13px 15px;

      border:
        1px solid var(--line);

      border-radius:13px;

      background:#fbfcfb;
      color:var(--text);

      font-family:inherit;
      font-size:16px;

      outline:none;
      appearance:none;

      transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
    }

    input::placeholder{
      color:#9aa39e;
    }

    input:focus{
      background:#fff;
      border-color:var(--green);

      box-shadow:
        0 0 0 3px rgba(13,122,61,.12);
    }


    /* =========================================================
       LOGIN-BUTTON
       ========================================================= */

    button{
      display:flex;
      align-items:center;
      justify-content:center;

      width:100%;
      min-height:54px;

      margin-top:4px;

      padding:14px 18px;

      border:0;
      border-radius:14px;

      background:var(--green-2);
      color:white;

      font-family:inherit;

      font-size:
        clamp(15px,2.5vw,16px);

      font-weight:800;

      cursor:pointer;

      box-shadow:
        0 9px 24px rgba(21,148,71,.20);

      transition:
        background .18s ease,
        transform .12s ease,
        box-shadow .18s ease;
    }

    button:hover{
      background:#11813d;

      box-shadow:
        0 11px 28px rgba(21,148,71,.27);
    }

    button:active{
      transform:translateY(1px);
    }

    button:disabled{
      opacity:.65;
      cursor:wait;
      transform:none;
      box-shadow:none;
    }


    /* =========================================================
       PASSWORT VERGESSEN
       ========================================================= */

    .forgot-password{
      display:block;

      width:max-content;
      max-width:100%;

      margin:17px auto 0;

      padding:4px 8px;

      color:var(--green);

      text-decoration:none;

      font-size:
        clamp(13px,2vw,14px);

      font-weight:750;

      line-height:1.4;

      border-radius:8px;

      transition:
        color .18s ease,
        background .18s ease;
    }

    .forgot-password:hover{
      color:var(--green-dark);

      background:
        rgba(11,107,53,.07);
    }


    /* =========================================================
       MELDUNGEN
       ========================================================= */

    .message{
      display:none;

      margin-top:18px;

      padding:13px 15px;

      border-radius:12px;

      font-size:14px;
      line-height:1.45;
    }

    .message.error{
      display:block;

      color:#a91f16;

      background:#fff1f0;

      border:
        1px solid #ffd5d2;
    }

    .message.success{
      display:block;

      color:#086c37;

      background:#eaf6ef;

      border:
        1px solid #ccebd8;
    }


    /* =========================================================
       ZURÜCK
       ========================================================= */

    .back{
      display:block;

      width:max-content;
      max-width:100%;

      margin:
        clamp(17px,3vw,22px) auto 0;

      padding:4px 8px;

      color:
        rgba(255,255,255,.88);

      text-decoration:none;

      font-size:
        clamp(13px,2vw,14px);

      line-height:1.4;

      border-radius:8px;

      transition:
        color .18s ease,
        background .18s ease;
    }

    .back:hover{
      color:white;

      background:
        rgba(255,255,255,.08);
    }


    /* =========================================================
       TABLET
       ========================================================= */

    @media(max-width:800px){

      body{
        align-items:center;

        padding:
          24px 18px;
      }

      .login-wrapper{
        max-width:500px;
      }

      .login-card{
        padding:
          clamp(24px,5vw,34px);
      }
    }


    /* =========================================================
       SMARTPHONE
       ========================================================= */

    @media(max-width:520px){

      body{
        align-items:flex-start;

        padding:
          18px 14px 22px;
      }

      .login-wrapper{
        max-width:none;
      }

      .brand{
        margin-bottom:18px;
      }

      .logo{
        width:76px;
        height:76px;

        margin-bottom:12px;
      }

      .brand h1{
        font-size:24px;
      }

      .brand p{
        font-size:13px;
      }

      .login-card{
        padding:
          24px 20px;

        border-radius:22px;
      }

      .login-card h2{
        font-size:28px;
      }

      input{
        min-height:52px;
      }

      button{
        min-height:54px;
      }
    }


    /* =========================================================
       SEHR KLEINE SMARTPHONES
       ========================================================= */

    @media(max-width:360px){

      body{
        padding:
          14px 11px 18px;
      }

      .brand h1{
        font-size:22px;
      }

      .login-card{
        padding:
          21px 17px;
      }

      .login-card h2{
        font-size:26px;
      }

      .intro{
        font-size:13px;
      }
    }


    /* =========================================================
       QUERFORMAT / KLEINE HÖHE
       ========================================================= */

    @media(max-height:700px) and (orientation:landscape){

      body{
        align-items:flex-start;
        padding:16px;
      }

      .login-wrapper{
        max-width:560px;
      }

      .brand{
        margin-bottom:12px;
      }

      .logo{
        width:58px;
        height:58px;
        margin-bottom:6px;
      }

      .brand h1{
        font-size:22px;
      }

      .brand p{
        margin-top:4px;
      }

      .login-card{
        padding:20px 24px;
      }

      .login-card h2{
        font-size:25px;
      }

      .intro{
        margin-bottom:18px;
      }

      .field{
        margin-bottom:13px;
      }

      input{
        min-height:46px;
        padding:11px 14px;
      }

      button{
        min-height:48px;
      }

      .back{
        margin-top:12px;
      }
    }


    /* =========================================================
       GROSSE BILDSCHIRME
       ========================================================= */

    @media(min-width:1400px){

      .login-wrapper{
        max-width:520px;
      }
    }

  </style>
</head>


<body>

  <main class="login-wrapper">


    <!-- =======================================================
         BRAND
         ======================================================= -->

    <div class="brand">

      <img
        src="../assets/Logo.png"
        alt="USV Jugendfußball"
        class="logo"
      >

      <h1>
        USV Jugendfußball
      </h1>

      <p>
        Geschützter Trainerbereich
      </p>

    </div>


    <!-- =======================================================
         LOGIN
         ======================================================= -->

    <section class="login-card">

      <p class="eyebrow">
        Trainerbereich
      </p>

      <h2>
        Trainer-Login
      </h2>

      <p class="intro">
        Bitte mit deiner hinterlegten E-Mail-Adresse
        und deinem Passwort anmelden.
      </p>


      <form id="loginForm">


        <div class="field">

          <label for="email">
            E-Mail-Adresse
          </label>

          <input
            id="email"
            type="email"
            autocomplete="username"
            placeholder="name@beispiel.de"
            required
          >

        </div>


        <div class="field">

          <label for="password">
            Passwort
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Passwort"
            required
          >

        </div>


        <button
          id="loginButton"
          type="submit"
        >
          Zum Trainerbereich
        </button>


        <a
          href="#"
          id="forgotPassword"
          class="forgot-password"
        >
          Passwort vergessen?
        </a>


        <div
          id="message"
          class="message"
        ></div>


      </form>

    </section>


    <!-- =======================================================
         ZURÜCK ZUR STARTSEITE
         ======================================================= -->

    <a
      class="back"
      href="../index.html"
    >
      ← Zurück zur Startseite
    </a>


  </main>


  <!-- =========================================================
       SUPABASE
       ========================================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://sluoffqujtofnhmfqfac.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_MbxdNe22XUoLVfF5_K-6xA_Wkos9EmS";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================================================
       MELDUNG ANZEIGEN
       ========================================================= */

    function showMessage(text, type) {

      const message =
        document.getElementById("message");

      message.textContent =
        text;

      message.className =
        "message " + type;
    }


    function clearMessage() {

      const message =
        document.getElementById("message");

      message.textContent = "";
      message.className = "message";
    }


    /* =========================================================
       LOGIN
       ========================================================= */

    document
      .getElementById("loginForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();

          clearMessage();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          const password =
            document
              .getElementById("password")
              .value;


          const button =
            document.getElementById("loginButton");


          button.disabled = true;

          button.textContent =
            "Anmeldung läuft …";


          try {

            console.log(
              "Trainer-Login gestartet"
            );


            const {
              data,
              error
            } =
              await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
              });


            console.log(
              "Supabase Antwort:",
              data,
              error
            );


            if (error) {
              throw error;
            }


            if (!data || !data.user) {

              throw new Error(
                "Supabase hat keinen Benutzer zurückgegeben."
              );

            }


            showMessage(
              "Anmeldung erfolgreich. Trainerbereich wird geöffnet …",
              "success"
            );


            button.textContent =
              "Angemeldet ✓";


            setTimeout(function() {

              window.location.href =
                "index.html";

            }, 700);


          } catch (error) {

            console.error(
              "Trainer-Login:",
              error
            );


            showMessage(
              error.message ||
              "Die Anmeldung konnte nicht durchgeführt werden.",
              "error"
            );


            button.disabled = false;

            button.textContent =
              "Zum Trainerbereich";

          }

        }
      );


    /* =========================================================
       PASSWORT VERGESSEN
       ========================================================= */

    document
      .getElementById("forgotPassword")
      .addEventListener(
        "click",
        async function(event) {

          event.preventDefault();

          clearMessage();


          const email =
            document
              .getElementById("email")
              .value
              .trim();


          if (!email) {

            showMessage(
              "Bitte zuerst deine E-Mail-Adresse eingeben.",
              "error"
            );

            document
              .getElementById("email")
              .focus();

            return;
          }


          const forgotLink =
            document.getElementById(
              "forgotPassword"
            );


          const originalText =
            forgotLink.textContent;


          forgotLink.style.pointerEvents =
            "none";

          forgotLink.style.opacity =
            ".6";

          forgotLink.textContent =
            "E-Mail wird gesendet …";


          try {

            const {
              error
            } =
              await supabaseClient.auth.resetPasswordForEmail(
                email,
                {
                  redirectTo:
                    "https://jugendleiterfussball.github.io/elterninfos/trainer/update-password.html"
                }
              );


            if (error) {
              throw error;
            }


            showMessage(
              "Wir haben dir eine E-Mail zum Zurücksetzen des Passworts geschickt. Bitte prüfe auch deinen Spam-Ordner.",
              "success"
            );


          } catch (error) {

            console.error(
              "Passwort zurücksetzen:",
              error
            );


            showMessage(
              "Die E-Mail konnte nicht gesendet werden. Bitte prüfe die E-Mail-Adresse und versuche es erneut.",
              "error"
            );

          }


          forgotLink.style.pointerEvents =
            "auto";

          forgotLink.style.opacity =
            "1";

          forgotLink.textContent =
            originalText;

        }
      );

  </script>

</body>
</html>
