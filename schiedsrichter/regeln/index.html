<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Schiri-Trainer | Regel lernen</title>

<style>
:root{
  --green:#0b6b35;
  --green2:#1bad58;
  --dark:#07130c;
  --dark2:#0b2a17;
  --bg:#f4f7f5;
  --white:#ffffff;
  --text:#17201b;
  --muted:#66716b;
  --line:#dfe7e2;
  --yellow:#f3c623;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}

a,
button{
  -webkit-tap-highlight-color:transparent;
}


/* =========================================================
   KOPFBEREICH
   ========================================================= */

.hero{
  background:
    linear-gradient(
      110deg,
      #06100a,
      #0b2a17 60%,
      #103d22
    );
  color:white;
  padding:25px 20px 44px;
}

.hero-inner{
  max-width:950px;
  margin:auto;
}

.back{
  display:inline-block;
  color:#dff3e6;
  text-decoration:none;
  font-weight:800;
  margin-bottom:35px;
}

.back:hover{
  color:white;
}

.eyebrow{
  color:#c9f1d5;
  font-size:12px;
  font-weight:900;
  letter-spacing:.09em;
}

.eyebrow::before{
  content:"";
  display:inline-block;
  width:28px;
  height:3px;
  background:var(--yellow);
  margin-right:9px;
  vertical-align:middle;
}

.hero h1{
  margin:12px 0 0;
  font-size:clamp(36px,7vw,58px);
  line-height:1.05;
}

.rule-version{
  margin-top:14px;
  color:#c9f1d5;
  font-size:13px;
  font-weight:700;
}


/* =========================================================
   INHALT
   ========================================================= */

main{
  max-width:950px;
  margin:auto;
  padding:30px 18px 70px;
}

.intro{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:24px;
  margin-bottom:20px;
  font-size:17px;
  box-shadow:0 7px 22px rgba(12,36,22,.05);
}

.section{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  margin-bottom:16px;
}

.section h2{
  margin:0 0 14px;
  color:var(--green);
  font-size:22px;
}

.section ul{
  margin:0;
  padding-left:22px;
}

.section li{
  margin-bottom:9px;
}

.section li:last-child{
  margin-bottom:0;
}


/* =========================================================
   MERKSÄTZE
   ========================================================= */

.memory{
  background:
    linear-gradient(
      135deg,
      var(--dark),
      var(--dark2)
    );
  color:white;
  border-radius:18px;
  padding:24px;
  margin-top:26px;
}

.memory h2{
  margin:0 0 14px;
  color:#82e3a9;
  font-size:22px;
}

.memory ul{
  margin:0;
  padding-left:22px;
}

.memory li{
  margin-bottom:9px;
}


/* =========================================================
   REGELWECHSEL
   ========================================================= */

.rule-switcher{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:12px;
  margin-top:30px;
}

.btn{
  display:block;
  text-decoration:none;
  border-radius:12px;
  padding:13px 17px;
  font-weight:900;
  text-align:center;
}

.btn-prev{
  background:white;
  color:var(--green);
  border:1px solid var(--line);
}

.btn-prev:hover{
  border-color:#a8c7b2;
}

.btn-next{
  background:var(--green);
  color:white;
  border:1px solid var(--green);
}

.btn-next:hover{
  background:#07592b;
}

.rule-position{
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  white-space:nowrap;
}


/* =========================================================
   ZUR ÜBERSICHT
   ========================================================= */

.overview{
  text-align:center;
  margin-top:25px;
}

.overview a{
  color:var(--green);
  font-weight:900;
  text-decoration:none;
}


/* =========================================================
   QUELLE
   ========================================================= */

.source{
  margin-top:35px;
  padding-top:20px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
}

.source a{
  color:var(--green);
  font-weight:800;
}


/* =========================================================
   FEHLER
   ========================================================= */

.error{
  background:#fff1f1;
  border:1px solid #e5aaaa;
  color:#8a1f1f;
  border-radius:16px;
  padding:20px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:650px){

  .hero{
    padding:20px 17px 38px;
  }

  .back{
    margin-bottom:30px;
  }

  main{
    padding-left:14px;
    padding-right:14px;
  }

  .intro,
  .section,
  .memory{
    padding:19px;
  }

  .rule-switcher{
    grid-template-columns:1fr 1fr;
  }

  .rule-position{
    grid-column:1 / -1;
    grid-row:1;
    text-align:center;
  }

  .btn-prev{
    grid-column:1;
    grid-row:2;
  }

  .btn-next{
    grid-column:2;
    grid-row:2;
  }

}

</style>
</head>


<body>

<header class="hero">

  <div class="hero-inner">

    <a
      class="back"
      href="../index.html#lernen"
    >
      ← Zurück zu den 17 Regeln
    </a>

    <div
      class="eyebrow"
      id="ruleNumber"
    >
      SCHIEDSRICHTER
    </div>

    <h1 id="ruleTitle">
      Regel wird geladen …
    </h1>

    <div
      class="rule-version"
      id="ruleVersion"
    ></div>

  </div>

</header>


<main id="content">

  <div class="intro">
    Lerninhalt wird geladen …
  </div>

</main>


<script>

let CONFIG = {};
let RULES = [];
let RULE = null;


/* =========================================================
   REGELNUMMER AUS URL
   ========================================================= */

function getRuleNumber(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const number =
    parseInt(
      params.get("regel"),
      10
    );

  if(
    !number ||
    number < 1 ||
    number > 17
  ){
    return 1;
  }

  return number;

}


/* =========================================================
   JSON LADEN
   ========================================================= */

async function loadJson(url,fallback){

  try{

    const response =
      await fetch(
        new URL(
          url,
          window.location.href
        ),
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        url +
        " – HTTP " +
        response.status
      );

    }

    const text =
      await response.text();

    if(!text.trim()){
      return fallback;
    }

    return JSON.parse(text);

  }
  catch(error){

    console.error(
      "Fehler beim Laden von " +
      url,
      error
    );

    return fallback;

  }

}


/* =========================================================
   HTML SICHER AUSGEBEN
   ========================================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   REGEL DARSTELLEN
   ========================================================= */

function renderRule(){

  if(!RULE){
    return;
  }


  document.title =
    "Schiri-Trainer | Regel " +
    RULE.id +
    " – " +
    RULE.title;


  document
    .getElementById(
      "ruleNumber"
    )
    .textContent =
      "REGEL " +
      RULE.id;


  document
    .getElementById(
      "ruleTitle"
    )
    .textContent =
      RULE.title;


  if(
    CONFIG &&
    CONFIG.rules &&
    CONFIG.rules.season
  ){

    document
      .getElementById(
        "ruleVersion"
      )
      .innerHTML =
        "<strong>Regelstand:</strong> " +
        escapeHtml(
          CONFIG.rules.season
        );

  }


  let html = "";


  html += `
    <div class="intro">
      ${escapeHtml(RULE.intro)}
    </div>
  `;


  if(
    Array.isArray(
      RULE.sections
    )
  ){

    RULE.sections.forEach(
      section => {

        html += `
          <section class="section">

            <h2>
              ${escapeHtml(section.title)}
            </h2>

            <ul>
        `;


        if(
          Array.isArray(
            section.items
          )
        ){

          section.items.forEach(
            item => {

              html += `
                <li>
                  ${escapeHtml(item)}
                </li>
              `;

            }
          );

        }


        html += `
            </ul>

          </section>
        `;

      }
    );

  }


  if(
    Array.isArray(
      RULE.memory
    ) &&
    RULE.memory.length
  ){

    html += `

      <section class="memory">

        <h2>
          Das solltest du dir merken
        </h2>

        <ul>

    `;


    RULE.memory.forEach(
      item => {

        html += `
          <li>
            ${escapeHtml(item)}
          </li>
        `;

      }
    );


    html += `

        </ul>

      </section>

    `;

  }


  html +=
    createNavigation();


  html += `
    <div class="overview">

      <a href="../index.html#lernen">
        Alle 17 Regeln anzeigen
      </a>

    </div>
  `;


  if(
    CONFIG &&
    CONFIG.sources &&
    CONFIG.sources.dfb
  ){

    html += `

      <div class="source">

        Lernhilfe auf Grundlage der
        aktuellen Fußballregeln.

        Für verbindliche Regelauslegung
        gilt das offizielle Regelwerk.

        <br><br>

        <a
          href="${escapeHtml(CONFIG.sources.dfb.url)}"
          target="_blank"
          rel="noopener"
        >
          ${escapeHtml(CONFIG.sources.dfb.name)} →
        </a>

      </div>

    `;

  }


  document
    .getElementById(
      "content"
    )
    .innerHTML =
      html;

}


/* =========================================================
   VORHERIGE / NÄCHSTE REGEL
   ========================================================= */

function createNavigation(){

  const currentIndex =
    RULES.findIndex(
      item =>
        Number(item.id) ===
        Number(RULE.id)
    );


  if(currentIndex === -1){
    return "";
  }


  const previous =
    RULES[
      currentIndex - 1
    ];


  const next =
    RULES[
      currentIndex + 1
    ];


  let html = `

    <div class="rule-switcher">

  `;


  if(previous){

    html += `

      <a
        class="btn btn-prev"
        href="?regel=${previous.id}"
      >
        ← Regel ${previous.id}
      </a>

    `;

  }
  else{

    html += `
      <span></span>
    `;

  }


  html += `

    <div class="rule-position">
      Regel ${RULE.id} von ${RULES.length}
    </div>

  `;


  if(next){

    html += `

      <a
        class="btn btn-next"
        href="?regel=${next.id}"
      >
        Regel ${next.id} →
      </a>

    `;

  }
  else{

    html += `
      <span></span>
    `;

  }


  html += `
    </div>
  `;


  return html;

}


/* =========================================================
   FEHLERANZEIGE
   ========================================================= */

function showError(number){

  document
    .getElementById(
      "ruleNumber"
    )
    .textContent =
      "SCHIEDSRICHTER";


  document
    .getElementById(
      "ruleTitle"
    )
    .textContent =
      "Regel nicht verfügbar";


  document
    .getElementById(
      "content"
    )
    .innerHTML = `

      <div class="error">

        <strong>
          Regel ${number} konnte nicht geladen werden.
        </strong>

        <br><br>

        Bitte gehe zurück zur Regelübersicht.

      </div>


      <div class="overview">

        <a href="../index.html#lernen">
          ← Zurück zu den 17 Regeln
        </a>

      </div>

    `;

}


/* =========================================================
   APP STARTEN
   ========================================================= */

async function init(){

  const number =
    getRuleNumber();


  CONFIG =
    await loadJson(
      "../config.json",
      {}
    );


  RULES =
    await loadJson(
      "../rules.json",
      []
    );


  if(
    !Array.isArray(RULES)
  ){

    RULES = [];

  }


  RULE =
    RULES.find(
      item =>
        Number(item.id) ===
        number
    ) || null;


  if(!RULE){

    showError(
      number
    );

    return;

  }


  renderRule();

}


init();

</script>

</body>
</html>
